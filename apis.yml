description: Fueloyal is an automotive IoT and connected-vehicle platform company that
  builds proprietary IoT gateway hardware and software for fleet management, fuel
  management, predictive maintenance, dual dash cameras, EV services, and OEM connected-vehicle
  solutions. Its products help fleets and vehicle manufacturers monitor, connect,
  and service vehicles, with an OEM connected-platform and marketplace for delivering
  connected-vehicle services and mobile apps. Backed by Techstars, Fueloyal was added
  to the API Evangelist network as a company profile; no public developer portal,
  API documentation, or machine-readable API specification was found during enrichment.
